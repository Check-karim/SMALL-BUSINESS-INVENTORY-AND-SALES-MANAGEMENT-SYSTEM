<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block pagetitle %}Home{% endblock %} · Brico NB Ltd</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{{ 'has-app' if me else 'has-public' }}">
  <a class="skip" href="#content">Skip to content</a>
  {% if me %}
    {% include "partials/sidebar.html" %}
    <div class="app-main">
      <header class="topbar">
        <button type="button" class="nav-toggle" data-nav-toggle aria-label="Open menu">Menu</button>
        <p>{{ me.branch_name }}</p>
      </header>
      <main id="content" class="canvas">
  {% else %}
    {% include "partials/public_header.html" %}
    <main id="content">
  {% endif %}
        {% include "partials/flashes.html" %}
        {% block content %}{% endblock %}
  {% if me %}
      </main>
    </div>
  {% else %}
    </main>
    {% include "partials/footer.html" %}
  {% endif %}
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
